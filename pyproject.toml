[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-agent"
version = "2.0.0"
description = "Approval-gated AI coding agent with Git worktrees, GitHub issues, Docker tests and cost control"
requires-python = ">=3.11"
dependencies = ["openai>=3.41.0,<4"]

[project.scripts]
ai-coding-agent = "coding_agent.cli:main"

[tool.setuptools]
packages = ["coding_agent"]
include-package-data = true

[tool.setuptools.package-data]
coding_agent = ["pricing.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "docker: requires a running Docker daemon and may build images",
]
